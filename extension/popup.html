<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Fysi CRM Bridge</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0; padding: 16px; width: 320px;
    background: #FAFAF8; color: #162322;
  }
  h1 { font-size: 14px; margin: 0 0 12px; font-weight: 700; }
  label { display: block; font-size: 11px; font-weight: 600; margin: 8px 0 4px; color: #6B8585; text-transform: uppercase; letter-spacing: .08em; }
  input {
    width: 100%; padding: 8px 10px; border-radius: 8px; box-sizing: border-box;
    border: 1px solid #E6E6E1; background: #fff; font-size: 12px; outline: none;
  }
  input:focus { border-color: #0D3839; }
  button {
    margin-top: 12px; width: 100%; padding: 10px;
    background: #0D3839; color: #F4F99D;
    border: none; border-radius: 8px; font-weight: 700;
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    cursor: pointer;
  }
  button:hover { opacity: .9; }
  #status { margin-top: 12px; font-size: 11px; color: #6B8585; min-height: 16px; }
  .ok { color: #15803D; }
  .err { color: #B91C1C; }
  .hint { margin-top: 16px; font-size: 11px; color: #8AA09A; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Fysi CRM Bridge</h1>
  <label>URL do wa-server</label>
  <input id="waUrl" type="url" placeholder="https://wa-fysi.177-73-235-85.nip.io" />
  <label>Token</label>
  <input id="waToken" type="password" placeholder="cbdfc4cd…" />
  <button id="save">Salvar</button>
  <p id="status"></p>
  <p class="hint">Depois de salvar: abra <b>web.whatsapp.com</b>, escaneie o QR como sempre, e a extensão começa a empurrar conversas pro seu CRM.</p>
  <script src="popup.js"></script>
</body>
</html>
