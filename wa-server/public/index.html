<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fysi WA — Painel</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,Segoe UI,sans-serif;
         background:#ECEAE3; color:#162322; }
  .wrap { max-width:480px; margin:0 auto; padding:28px 18px 80px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:#8AA09A; font-size:13px; margin:0 0 22px; }
  .card { background:#fff; border:1px solid #E6E6E1; border-radius:16px;
          padding:20px; margin-bottom:14px; }
  .card-title { font-size:14px; font-weight:800; margin-bottom:14px; }
  .badge { display:inline-flex; align-items:center; gap:6px; font-size:12px;
           font-weight:700; padding:4px 12px; border-radius:999px;
           text-transform:uppercase; letter-spacing:.06em; }
  .badge.open { background:#DCF5E8; color:#0D7A4A; }
  .badge.qr   { background:#FFF1CC; color:#9A6700; }
  .badge.off  { background:#F2DADA; color:#A33; }
  label { display:block; font-size:11px; font-weight:700; text-transform:uppercase;
          letter-spacing:.09em; color:#8AA09A; margin:12px 0 6px; }
  input[type=text], input[type=file], textarea { width:100%; padding:10px 12px;
          border:1px solid #DFE0DB; border-radius:10px; font-size:14px;
          background:#F4F3EF; font-family:inherit; }
  textarea { resize:vertical; min-height:70px; }
  button { border:0; border-radius:10px; background:#0D3839; color:#fff;
           font-weight:700; font-size:13px; cursor:pointer; padding:11px 14px; }
  button:hover { opacity:.92; }
  .btn-full { width:100%; margin-top:12px; }
  .btn-ghost { background:transparent; color:#A33; border:1px solid #E6C6C6; }
  .qr-img { width:250px; height:250px; display:block; margin:14px auto; border-radius:12px; }
  .hint { font-size:12px; color:#8AA09A; line-height:1.5; margin:8px 0 0; }
  .empty { font-size:13px; color:#A8B5B0; text-align:center; padding:14px 0; margin:0; }
  /* listas */
  .list { display:flex; flex-direction:column; gap:8px; }
  .list-item { display:flex; align-items:center; gap:10px; padding:10px 12px;
               background:#F4F3EF; border:1px solid #E6E6E1; border-radius:12px; }
  .li-info { flex:1; min-width:0; }
  .li-name { display:block; font-size:13px; font-weight:700; }
  .li-sub { display:block; font-size:11px; color:#8AA09A; white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis; }
  .li-actions { display:flex; gap:6px; flex-shrink:0; }
  .btn-send { background:#0D7A4A; padding:7px 12px; font-size:12px; }
  .btn-del { background:transparent; color:#A8B5B0; border:1px solid #DFE0DB;
             padding:7px 9px; font-size:12px; }
  .btn-del:hover { color:#A33; border-color:#E6C6C6; }
  /* add form */
  details { margin-top:12px; }
  summary { cursor:pointer; font-size:12px; font-weight:700; color:#0D3839;
            list-style:none; padding:6px 0; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:'+ '; }
  details[open] summary::before { content:'– '; }
  /* contato */
  #contato { font-size:16px; font-weight:700; }
  /* toast */
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(40px);
           background:#162322; color:#fff; font-size:13px; font-weight:600;
           padding:11px 18px; border-radius:999px; opacity:0; transition:.25s;
           pointer-events:none; max-width:90vw; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err { background:#A33; }
  .toast.ok  { background:#0D7A4A; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fysi WA — Painel</h1>
  <p class="sub">enviar mensagens e áudios salvos</p>

  <!-- status / QR -->
  <div class="card">
    <span id="badge" class="badge off">conectando…</span>
    <div id="qr-area"></div>
    <div id="connected-info" class="hint" style="display:none; margin-top:12px"></div>
  </div>

  <!-- painel (aparece quando conectado) -->
  <div id="panel" hidden>

    <!-- contato -->
    <div class="card">
      <div class="card-title">📇 Contato</div>
      <label>Número do contato (com DDI 55)</label>
      <input type="text" id="contato" placeholder="5547999999999" />
      <p class="hint">Os botões "Enviar" abaixo mandam tudo para esse número.</p>
    </div>

    <!-- mensagens salvas -->
    <div class="card">
      <div class="card-title">💬 Mensagens salvas</div>
      <div id="snippet-list" class="list"></div>
      <details>
        <summary>Nova mensagem</summary>
        <label>Nome (para você identificar)</label>
        <input type="text" id="snip-name" placeholder="Saudação inicial" />
        <label>Conteúdo da mensagem</label>
        <textarea id="snip-content" placeholder="Olá! Tudo bem? Aqui é da Fysi…"></textarea>
        <button class="btn-full" onclick="addSnippet()">Salvar mensagem</button>
      </details>
    </div>

    <!-- áudios salvos -->
    <div class="card">
      <div class="card-title">🎙️ Áudios salvos</div>
      <div id="audio-list" class="list"></div>
      <details>
        <summary>Novo áudio</summary>
        <label>Nome (para você identificar)</label>
        <input type="text" id="aud-name" placeholder="Áudio de apresentação" />
        <label>Arquivo de áudio</label>
        <input type="file" id="aud-file" accept="audio/*" />
        <p class="hint">É convertido automaticamente — chega como mensagem de voz.</p>
        <button class="btn-full" onclick="addAudio()">Salvar áudio</button>
      </details>
    </div>

    <!-- mensagem avulsa -->
    <div class="card">
      <div class="card-title">✏️ Mensagem avulsa</div>
      <input type="text" id="free-text" placeholder="digite e envie na hora" />
      <button class="btn-full" onclick="sendFree()">Enviar</button>
    </div>

    <div class="card">
      <button class="btn-ghost btn-full" onclick="logout()">Desconectar WhatsApp</button>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  // Auth: lê ?t=TOKEN da URL e injeta em toda chamada fetch ao backend.
  // Em prod o wa-server roda com WA_AUTH_TOKEN — sem isso devolve 401.
  const WA_TOKEN = new URLSearchParams(location.search).get('t') || ''
  if (WA_TOKEN) {
    const _fetch = window.fetch.bind(window)
    window.fetch = (input, init = {}) => {
      const url = typeof input === 'string' ? input : input.url
      // só injeta para chamadas relativas (mesma origem)
      if (url && !/^https?:/i.test(url)) {
        init.headers = new Headers(init.headers || {})
        if (!init.headers.has('Authorization')) {
          init.headers.set('Authorization', 'Bearer ' + WA_TOKEN)
        }
      }
      return _fetch(input, init)
    }
  }

  const $ = (id) => document.getElementById(id)
  let libLoaded = false
  let lib = { snippets: [], audios: [] }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  }

  function toast(msg, ok = true) {
    const t = $('toast')
    t.textContent = msg
    t.className = 'toast show ' + (ok ? 'ok' : 'err')
    clearTimeout(t._timer)
    t._timer = setTimeout(() => { t.className = 'toast' }, 3200)
  }

  function fmtDur(s) {
    s = Math.round(s || 0)
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
  }

  function contato() {
    const v = $('contato').value.trim()
    if (!v) { toast('Defina o número do contato primeiro.', false); return null }
    return v
  }

  // ─── status ───────────────────────────────────────────
  async function poll() {
    let state = 'close', me = null
    try {
      const s = await fetch('/status').then((r) => r.json())
      state = s.state; me = s.me
    } catch {}
    const badge = $('badge')
    if (state === 'open') {
      badge.className = 'badge open'; badge.textContent = 'conectado'
      $('qr-area').innerHTML = ''
      $('connected-info').style.display = ''
      $('connected-info').innerHTML = 'Conectado: <strong>' + (me || '—') + '</strong>'
      $('panel').hidden = false
      if (!libLoaded) loadLibrary()
    } else if (state === 'qr') {
      badge.className = 'badge qr'; badge.textContent = 'aguardando scan'
      $('connected-info').style.display = 'none'
      $('panel').hidden = true
      const { qr } = await fetch('/qr').then((r) => r.json())
      $('qr-area').innerHTML = qr
        ? '<img class="qr-img" src="' + qr + '" />' +
          '<p class="hint" style="text-align:center">WhatsApp → Aparelhos conectados → Conectar um aparelho</p>'
        : '<p class="hint">Gerando QR…</p>'
    } else {
      badge.className = 'badge off'; badge.textContent = 'conectando…'
      $('qr-area').innerHTML = ''
      $('connected-info').style.display = 'none'
      $('panel').hidden = true
    }
  }

  // ─── biblioteca ───────────────────────────────────────
  async function loadLibrary() {
    try {
      lib = await fetch('/library').then((r) => r.json())
      libLoaded = true
      renderSnippets()
      renderAudios()
    } catch {
      toast('Erro ao carregar a biblioteca', false)
    }
  }

  function renderSnippets() {
    const el = $('snippet-list')
    if (!lib.snippets.length) {
      el.innerHTML = '<p class="empty">Nenhuma mensagem salva ainda.</p>'
      return
    }
    el.innerHTML = lib.snippets.map((s) => `
      <div class="list-item" data-id="${s.id}">
        <div class="li-info">
          <span class="li-name">${esc(s.name)}</span>
          <span class="li-sub">${esc(s.content.slice(0, 60))}${s.content.length > 60 ? '…' : ''}</span>
        </div>
        <div class="li-actions">
          <button class="btn-send">Enviar</button>
          <button class="btn-del" title="Apagar">✕</button>
        </div>
      </div>`).join('')
  }

  function renderAudios() {
    const el = $('audio-list')
    if (!lib.audios.length) {
      el.innerHTML = '<p class="empty">Nenhum áudio salvo ainda.</p>'
      return
    }
    el.innerHTML = lib.audios.map((a) => `
      <div class="list-item" data-id="${a.id}">
        <div class="li-info">
          <span class="li-name">${esc(a.name)}</span>
          <span class="li-sub">🎙️ ${fmtDur(a.seconds)}</span>
        </div>
        <div class="li-actions">
          <button class="btn-send">Enviar</button>
          <button class="btn-del" title="Apagar">✕</button>
        </div>
      </div>`).join('')
  }

  // ─── envios ───────────────────────────────────────────
  async function sendSnippet(id) {
    const to = contato(); if (!to) return
    const s = lib.snippets.find((x) => x.id === id); if (!s) return
    try {
      const r = await fetch('/send-text', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to, text: s.content }),
      }).then((r) => r.json())
      toast(r.ok ? 'Mensagem enviada!' : 'Erro: ' + r.error, r.ok)
    } catch (e) { toast('Erro: ' + e.message, false) }
  }

  async function sendAudio(id) {
    const to = contato(); if (!to) return
    toast('Enviando áudio…')
    try {
      const r = await fetch('/library/audio/' + id + '/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to }),
      }).then((r) => r.json())
      toast(r.ok ? 'Áudio enviado!' : 'Erro: ' + r.error, r.ok)
    } catch (e) { toast('Erro: ' + e.message, false) }
  }

  async function sendFree() {
    const to = contato(); if (!to) return
    const text = $('free-text').value.trim()
    if (!text) return toast('Digite uma mensagem.', false)
    try {
      const r = await fetch('/send-text', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to, text }),
      }).then((r) => r.json())
      if (r.ok) { $('free-text').value = ''; toast('Mensagem enviada!') }
      else toast('Erro: ' + r.error, false)
    } catch (e) { toast('Erro: ' + e.message, false) }
  }

  // ─── gerenciar biblioteca ─────────────────────────────
  async function addSnippet() {
    const name = $('snip-name').value.trim()
    const content = $('snip-content').value.trim()
    if (!name || !content) return toast('Preencha nome e conteúdo.', false)
    const r = await fetch('/library/snippet', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, content }),
    }).then((r) => r.json())
    if (r.ok) {
      $('snip-name').value = ''; $('snip-content').value = ''
      await loadLibrary(); toast('Mensagem salva!')
    } else toast('Erro: ' + r.error, false)
  }

  async function addAudio() {
    const name = $('aud-name').value.trim()
    const file = $('aud-file').files[0]
    if (!name || !file) return toast('Preencha nome e escolha um arquivo.', false)
    toast('Salvando áudio…')
    const fd = new FormData()
    fd.append('name', name); fd.append('audio', file)
    const r = await fetch('/library/audio', { method: 'POST', body: fd }).then((r) => r.json())
    if (r.ok) {
      $('aud-name').value = ''; $('aud-file').value = ''
      await loadLibrary(); toast('Áudio salvo!')
    } else toast('Erro: ' + r.error, false)
  }

  async function delSnippet(id) {
    if (!confirm('Apagar esta mensagem?')) return
    await fetch('/library/snippet/' + id, { method: 'DELETE' })
    await loadLibrary()
  }

  async function delAudio(id) {
    if (!confirm('Apagar este áudio?')) return
    await fetch('/library/audio/' + id, { method: 'DELETE' })
    await loadLibrary()
  }

  async function logout() {
    if (!confirm('Desconectar o WhatsApp?')) return
    await fetch('/logout', { method: 'POST' })
    libLoaded = false
  }

  // ─── cliques nas listas (delegação) ───────────────────
  $('snippet-list').addEventListener('click', (e) => {
    const row = e.target.closest('[data-id]'); if (!row) return
    if (e.target.classList.contains('btn-send')) sendSnippet(row.dataset.id)
    if (e.target.classList.contains('btn-del')) delSnippet(row.dataset.id)
  })
  $('audio-list').addEventListener('click', (e) => {
    const row = e.target.closest('[data-id]'); if (!row) return
    if (e.target.classList.contains('btn-send')) sendAudio(row.dataset.id)
    if (e.target.classList.contains('btn-del')) delAudio(row.dataset.id)
  })

  poll()
  setInterval(poll, 3000)
</script>
</body>
</html>
