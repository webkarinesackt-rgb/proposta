<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fysi WA — Teste de conexão</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,Segoe UI,sans-serif;
         background:#ECEAE3; color:#162322; }
  .wrap { max-width:460px; margin:0 auto; padding:32px 20px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#8AA09A; font-size:13px; margin:0 0 24px; }
  .card { background:#fff; border:1px solid #E6E6E1; border-radius:16px;
          padding:24px; margin-bottom:16px; }
  .badge { display:inline-flex; align-items:center; gap:6px; font-size:12px;
           font-weight:700; padding:4px 12px; border-radius:999px;
           text-transform:uppercase; letter-spacing:.06em; }
  .badge.open { background:#DCF5E8; color:#0D7A4A; }
  .badge.qr   { background:#FFF1CC; color:#9A6700; }
  .badge.off  { background:#F2DADA; color:#A33; }
  label { display:block; font-size:11px; font-weight:700; text-transform:uppercase;
          letter-spacing:.1em; color:#8AA09A; margin:14px 0 6px; }
  input[type=text], input[type=file] { width:100%; padding:10px 12px;
          border:1px solid #DFE0DB; border-radius:10px; font-size:14px; background:#F4F3EF; }
  button { width:100%; margin-top:14px; padding:12px; border:0; border-radius:10px;
           background:#0D3839; color:#fff; font-weight:700; font-size:13px; cursor:pointer; }
  button.ghost { background:transparent; color:#A33; border:1px solid #E6C6C6; }
  .qr-img { width:260px; height:260px; display:block; margin:16px auto; border-radius:12px; }
  .msg { font-size:13px; margin-top:10px; padding:8px 10px; border-radius:8px; }
  .msg.ok  { background:#DCF5E8; color:#0D7A4A; }
  .msg.err { background:#F2DADA; color:#A33; }
  .hint { font-size:12px; color:#8AA09A; line-height:1.5; }
  strong { font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fysi WA — Teste de conexão</h1>
  <p class="sub">PoC · servidor Baileys · QR + envio de áudio</p>

  <div class="card">
    <span id="badge" class="badge off">conectando…</span>
    <div id="qr-area"></div>
    <div id="connected-info" class="hint" style="display:none; margin-top:12px"></div>
  </div>

  <div id="forms" style="display:none">
    <div class="card">
      <strong>Enviar texto</strong>
      <label>Número (com DDI, ex.: 5547999999999)</label>
      <input type="text" id="t-to" placeholder="5547999999999" />
      <label>Mensagem</label>
      <input type="text" id="t-text" placeholder="Olá! Teste do Fysi WA" />
      <button onclick="sendText()">Enviar texto</button>
      <div id="t-msg"></div>
    </div>

    <div class="card">
      <strong>Enviar áudio (mensagem de voz)</strong>
      <label>Número (com DDI)</label>
      <input type="text" id="a-to" placeholder="5547999999999" />
      <label>Arquivo de áudio (.ogg de preferência)</label>
      <input type="file" id="a-file" accept="audio/*" />
      <button onclick="sendAudio()">Enviar áudio</button>
      <div id="a-msg"></div>
    </div>

    <div class="card">
      <p class="hint">Encerra a sessão atual e gera um novo QR.</p>
      <button class="ghost" onclick="logout()">Desconectar WhatsApp</button>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id)

  async function poll() {
    try {
      const s = await fetch('/status').then((r) => r.json())
      await render(s.state, s.me)
    } catch {
      await render('close')
    }
  }

  async function render(state, me) {
    const badge = $('badge')
    if (state === 'open') {
      badge.className = 'badge open'
      badge.textContent = 'conectado'
      $('qr-area').innerHTML = ''
      $('connected-info').style.display = ''
      $('connected-info').innerHTML = 'Número conectado: <strong>' + (me || '—') + '</strong>'
      $('forms').style.display = ''
    } else if (state === 'qr') {
      badge.className = 'badge qr'
      badge.textContent = 'aguardando scan'
      $('connected-info').style.display = 'none'
      $('forms').style.display = 'none'
      const { qr } = await fetch('/qr').then((r) => r.json())
      $('qr-area').innerHTML = qr
        ? '<img class="qr-img" src="' + qr + '" />' +
          '<p class="hint" style="text-align:center">WhatsApp → Aparelhos conectados → Conectar um aparelho</p>'
        : '<p class="hint">Gerando QR…</p>'
    } else {
      badge.className = 'badge off'
      badge.textContent = 'conectando…'
      $('qr-area').innerHTML = ''
      $('forms').style.display = 'none'
      $('connected-info').style.display = 'none'
    }
  }

  function flash(id, ok, text) {
    $(id).innerHTML = '<div class="msg ' + (ok ? 'ok' : 'err') + '">' + text + '</div>'
  }

  async function sendText() {
    const to = $('t-to').value, text = $('t-text').value
    if (!to || !text) return flash('t-msg', false, 'Preencha número e mensagem.')
    try {
      const r = await fetch('/send-text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to, text }),
      }).then((r) => r.json())
      flash('t-msg', r.ok, r.ok ? 'Enviado!' : 'Erro: ' + r.error)
    } catch (e) {
      flash('t-msg', false, 'Erro: ' + e.message)
    }
  }

  async function sendAudio() {
    const to = $('a-to').value, file = $('a-file').files[0]
    if (!to || !file) return flash('a-msg', false, 'Preencha número e escolha um arquivo.')
    const fd = new FormData()
    fd.append('to', to)
    fd.append('audio', file)
    try {
      const r = await fetch('/send-audio', { method: 'POST', body: fd }).then((r) => r.json())
      flash('a-msg', r.ok, r.ok ? 'Áudio enviado!' : 'Erro: ' + r.error)
    } catch (e) {
      flash('a-msg', false, 'Erro: ' + e.message)
    }
  }

  async function logout() {
    if (!confirm('Desconectar o WhatsApp?')) return
    await fetch('/logout', { method: 'POST' })
  }

  poll()
  setInterval(poll, 2500)
</script>
</body>
</html>
